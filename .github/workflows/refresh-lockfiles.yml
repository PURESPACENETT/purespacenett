name: Refresh lockfiles

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !startsWith(github.event.pull_request.head.sha, '') && !startsWith(github.event.pull_request.title, '[skip lockfile]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Refresh root lockfile
        run: bun install --lockfile-only

      - name: Refresh CRM lockfile
        working-directory: apps/crm
        run: bun install --lockfile-only

      - name: Commit refreshed lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock apps/crm/bun.lock
          git diff --cached --quiet && exit 0
          git commit -m "[skip lockfile] Synchroniser les lockfiles après migration"
          git push
