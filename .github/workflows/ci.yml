name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check Google reviews function
        run: deno check --config supabase/functions/google-reviews-sync/deno.json supabase/functions/google-reviews-sync/index.ts

      - name: Check Meta Ads function
        run: deno check --config supabase/functions/meta-ads-sync/deno.json supabase/functions/meta-ads-sync/index.ts

      - name: Check Meta Leads function
        run: deno check --config supabase/functions/meta-leads-webhook/deno.json supabase/functions/meta-leads-webhook/index.ts
